<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full-Screen Image Frame</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- LAYER 1: the decorative frame.
         Pure decoration: aria-hidden tells screen readers to skip it,
         and pointer-events:none in the CSS lets clicks pass through it. -->
    <div class="frame" aria-hidden="true">
        <!-- Top row -->
        <div class="frame-piece top-left"></div>
        <div class="frame-piece top-edge"></div>
        <div class="frame-piece top-right"></div>
        <!-- Middle row (sides only — the center stays empty for content) -->
        <div class="frame-piece left-edge"></div>
        <div class="frame-piece right-edge"></div>
        <!-- Bottom row -->
        <div class="frame-piece bottom-left"></div>
        <div class="frame-piece bottom-edge"></div>
        <div class="frame-piece bottom-right"></div>
    </div>

    <!-- LAYER 2: all scrollable content goes inside here, so it always
         paints above the frame and the wallpaper. -->
    <div class="page-content">
        <header class="header">
            <!-- later we can add logo/text here -->
        </header>

        <!-- Add your content below the header. If it grows taller than
             the screen, the page scrolls: the tinted wallpaper covers
             and moves with all of it, while the frame and the footer
             stay pinned to the screen. The CSS already reserves space
             at the bottom so nothing gets trapped behind the footer. -->
    </div>

    <!-- LAYER 2: the sticky footer. It lives OUTSIDE .page-content
         because it is pinned to the screen (position: fixed) and never
         scrolls with the content. Its position and size come entirely
         from the CSS — nothing to set here. -->
    <footer class="footer">
        <!-- WARNING: this element is flipped upside down by the CSS.
             Any text you put inside it will also appear upside down. -->
    </footer>
</body>
</html>

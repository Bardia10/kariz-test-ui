<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- LAYER 3: the decorative frame.
         Pure decoration: aria-hidden tells screen readers to skip it,
         and pointer-events:none in the CSS lets clicks pass through it. -->
    <div class="frame" aria-hidden="true">
        <!-- Top row -->
        <div class="frame-piece top-left"></div>
        <div class="frame-piece top-edge"></div>
        <div class="frame-piece top-right"></div>

        <!-- Middle row (sides only — the center stays empty for content) -->
        <div class="frame-piece left-edge"></div>
        <div class="frame-piece right-edge"></div>

        <!-- Bottom row -->
        <div class="frame-piece bottom-left"></div>
        <div class="frame-piece bottom-edge"></div>
        <div class="frame-piece bottom-right"></div>
    </div>

    <!-- LAYER 2: the inward shadow cast onto the content opening. -->
    <div class="content-shadow" aria-hidden="true"></div>

    <!-- LAYER 1: all scrollable page content. -->
    <div class="page-content">
        <header class="header">
            <!-- Later we can add the brand and market message here. -->
        </header>

        <main class="content">
            <!-- A product is one gold or silver name bar plus its red
                 and green gem buttons. All three images are simple
                 backgrounds; labels and prices remain real HTML text.

                 Gold name bar (default):
                 class="product-name"

                 Silver name bar:
                 class="product-name product-name--silver"

                 Only the class changes. The product structure and text
                 stay exactly the same. -->
            <section class="products" aria-label="Products">
                <article class="product">
                    <div class="product-name">Full Gold Coin</div>
                    <button class="product-price product-price--sell" type="button">5,829,000</button>
                    <button class="product-price product-price--buy" type="button">5,872,000</button>
                </article>

                <article class="product">
                    <div class="product-name">Half Gold Coin</div>
                    <button class="product-price product-price--sell" type="button">2,914,000</button>
                    <button class="product-price product-price--buy" type="button">2,953,000</button>
                </article>

                <article class="product">
                    <div class="product-name">Quarter Gold Coin</div>
                    <button class="product-price product-price--sell" type="button">1,457,000</button>
                    <button class="product-price product-price--buy" type="button">1,476,000</button>
                </article>

                <article class="product">
                    <div class="product-name">One-Gram Gold Coin</div>
                    <button class="product-price product-price--sell" type="button">5,835,000</button>
                    <button class="product-price product-price--buy" type="button">5,878,000</button>
                </article>

                <article class="product">
                    <div class="product-name  product-name--silver">Investment Coin</div>
                    <button class="product-price product-price--sell" type="button">5,790,000</button>
                    <button class="product-price product-price--buy" type="button">5,833,000</button>
                </article>
            </section>
        </main>
    </div>

    <!-- LAYER 4: the fixed footer. -->
    <footer class="footer">
        <!-- WARNING: this element is flipped upside down by the CSS.
             Any text placed directly inside it would also be flipped. -->
    </footer>
</body>
</html>

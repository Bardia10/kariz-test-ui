<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Footer SVG Icons</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: #d3d3d6;
      background: #07150c;
    }

    main {
      width: min(900px, calc(100% - 32px));
      padding: 28px;
      border: 1px solid #8c5c0b;
      border-radius: 14px;
      background: #050505;
      box-shadow: inset 0 0 0 2px #261704;
    }

    .settings {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: center;
      margin-bottom: 28px;
    }

    label {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 2px solid #cf9300;
      border-bottom: 1px solid #6a4300;
    }

    .item {
      min-height: 82px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 700;
      border-right: 1px solid #9f6c00;
    }

    .item:last-child {
      border-right: 0;
    }

    .icon {
      width: var(--icon-size);
      height: var(--icon-size);
      color: var(--icon-color);
      flex: none;
    }

    .icon * {
      vector-effect: non-scaling-stroke;
    }

    @media (max-width: 720px) {
      nav {
        grid-template-columns: 1fr 1fr;
      }

      .item:nth-child(2) {
        border-right: 0;
      }
    }
  </style>
</head>
<body>
  <main style="--icon-size:24px;--icon-color:#bfc0c4">
    <div class="settings">
      <label>
        Size
        <input id="size" type="range" min="14" max="64" value="24">
        <output id="sizeValue">24px</output>
      </label>
      <label>
        Color
        <input id="color" type="color" value="#bfc0c4">
      </label>
    </div>

    <nav aria-label="Footer navigation icon preview">
      <div class="item">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="7.25" r="3.25"/>
            <path d="M5.25 20c.35-4.15 2.85-6.5 6.75-6.5s6.4 2.35 6.75 6.5H5.25Z"/>
          </g>
        </svg>
        <span>Profile</span>
      </div>

      <div class="item">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 8h14"/>
            <path d="m15 5 3 3-3 3"/>
            <path d="M20 16H6"/>
            <path d="m9 13-3 3 3 3"/>
          </g>
        </svg>
        <span>Trade</span>
      </div>

      <div class="item">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="8"/>
            <path d="M12 7.5V12l3.25 2"/>
          </g>
        </svg>
        <span>History</span>
      </div>

      <div class="item">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5.5" y="3.5" width="13" height="17" rx="1"/>
            <path d="M8.5 8h7"/>
            <path d="M8.5 12h7"/>
            <path d="M8.5 16h5"/>
          </g>
        </svg>
        <span>Account Statement</span>
      </div>
    </nav>
  </main>

  <script>
    const root = document.querySelector("main");
    const size = document.querySelector("#size");
    const sizeValue = document.querySelector("#sizeValue");
    const color = document.querySelector("#color");

    size.addEventListener("input", () => {
      const value = `${size.value}px`;
      root.style.setProperty("--icon-size", value);
      sizeValue.value = value;
    });

    color.addEventListener("input", () => {
      root.style.setProperty("--icon-color", color.value);
    });
  </script>
</body>
</html>

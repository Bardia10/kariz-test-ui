<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Finance</title>
<link href="style.css" rel="stylesheet"/>
<script defer="" src="app.js"></script>
</head>
<body class="unified-home-theme" data-loading-duration="5000">
<!-- LAYER 3: the decorative frame.
         Pure decoration: aria-hidden tells screen readers to skip it,
         and pointer-events:none in the CSS lets clicks pass through it. -->

<!-- LAYER 2: the inward shadow cast onto the content opening. -->

<!-- LAYER 1: all scrollable page content. -->
<div class="page-content">
<header class="header">
<!-- Display-only logo. It is intentionally a plain image,
                 not a link or button, so it cannot be clicked. -->
<img alt="Company logo" class="header-logo" src="assets/logo.png"/>
<!-- The announcement is confined to its own clipped area,
                 so it can never travel underneath the transparent logo. -->
<div aria-label="Market announcement" class="header-announcement">
<span class="header-announcement-text">
                    Wholesale rates may change based on market movement.
                </span>
</div>
</header>
<main class="content">
<div class="main-title-row">

<h1 class="section-page-title">Finance</h1>

</div>
<section aria-label="Finance options" class="history-menu">
<a class="history-menu-button" href="possessions.html">Your Possessions / Account Statement</a>
<a class="history-menu-button" href="payment-withdrawal.html">Payment and Withdrawal</a>
</section>
</main>
</div>
<!-- LAYER 4: fixed footer navigation.
         Finance is the active section in this file. -->
<footer class="footer">
<nav aria-label="Primary navigation" class="footer-nav">
<a class="footer-nav-link" href="home.html">
<span aria-hidden="true" class="footer-nav-icon footer-nav-icon--profile"></span>
<span>Home</span>
</a>
<a class="footer-nav-link" href="index.html">
<span aria-hidden="true" class="footer-nav-icon footer-nav-icon--trade"></span>
<span>Trade</span>
</a>
<a class="footer-nav-link" href="history.html">
<span aria-hidden="true" class="footer-nav-icon footer-nav-icon--history"></span>
<span>History</span>
</a>
<a aria-current="page" class="footer-nav-link footer-nav-link--active" href="finance.html">
<span aria-hidden="true" class="footer-nav-icon footer-nav-icon--accounting"></span>
<span>Finance</span>
</a>
</nav>
</footer>
<!-- Full-screen loading layer. JavaScript shows it for five seconds
         whenever a ruby or emerald gem button is clicked. -->
<div aria-hidden="true" class="loading-overlay">
<div class="loading-overlay-content">
<img alt="" class="loading-overlay-logo" src="assets/logo.png"/>
<p class="loading-overlay-text">Kariz Gold Gallery</p>
</div>
</div>
</body>
</html>

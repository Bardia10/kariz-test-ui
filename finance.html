<!DOCTYPE html>

<html dir="rtl" lang="fa">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>امور مالی</title>
<link href="style.css" rel="stylesheet"/>
<script defer="" src="app.js"></script>
</head>
<body class="unified-home-theme" data-loading-duration="5000">
<!-- LAYER 3: the decorative frame.
         Pure decoration: aria-hidden tells screen readers to skip it,
         and pointer-events:none in the CSS lets clicks pass through it. -->
<!-- LAYER 2: the inward shadow cast onto the content opening. -->
<!-- LAYER 1: all scrollable page content. -->
<div class="page-content">
<header class="header">
<!-- Display-only logo. It is intentionally a plain image,
                 not a link or button, so it cannot be clicked. -->
<img alt="Company logo" class="header-logo" src="assets/logo.png"/>
<!-- The announcement is confined to its own clipped area,
                 so it can never travel underneath the transparent logo. -->
<div aria-label="Market announcement" class="header-announcement">
<span class="header-announcement-text">
                    نرخ‌های عمده‌فروشی ممکن است با نوسانات بازار تغییر کنند.
                </span>
</div>
</header>
<main class="content">
<div class="main-title-row">
<h1 class="section-page-title"><span aria-hidden="true" class="page-title-icon page-title-icon--finance"></span>امور مالی</h1>
</div>
<div class="finance-actions">
<section aria-labelledby="deposit-withdrawal-title" class="finance-action-section">
<!-- Persian: واریز و برداشت -->
<h2 class="finance-action-heading" id="deposit-withdrawal-title">واریز و برداشت</h2>
<div class="finance-action-grid">
<!-- Persian: ثبت فیش واریز شده -->
<button class="finance-action-button" type="button">ثبت فیش واریز شده</button>
<!-- Persian: واریز وجه در انتظار تایید -->
<button class="finance-action-button" type="button">واریز وجه در انتظار تأیید</button>
<!-- Persian: درخواست برداشت وجه -->
<button class="finance-action-button" type="button">درخواست برداشت وجه</button>
<!-- Persian: برداشت وجه در انتظار تایید -->
<button class="finance-action-button" type="button">برداشت وجه در انتظار تأیید</button>
<!-- Persian: در انتظار فیش -->
<button class="finance-action-button" type="button">در انتظار فیش</button>
<!-- Persian: آرشیو فیش ها -->
<button class="finance-action-button" type="button">آرشیو فیش‌ها</button>
</div>
</section>
<section aria-labelledby="transfers-title" class="finance-action-section">
<!-- Persian: حواله -->
<h2 class="finance-action-heading" id="transfers-title">حواله</h2>
<div class="finance-action-grid">
<!-- Persian: ثبت حواله جدید -->
<button class="finance-action-button" type="button">ثبت حواله جدید</button>
<!-- Persian: لیست حواله -->
<button class="finance-action-button" type="button">فهرست حواله‌ها</button>
</div>
</section>
</div>
</main>
</div>
<!-- LAYER 4: fixed footer navigation.
         Finance is the active section in this file. -->
<footer class="footer">
<nav aria-label="ناوبری اصلی" class="footer-nav">
<a class="footer-nav-link" href="home.html">
<span aria-hidden="true" class="footer-nav-icon footer-nav-icon--profile"></span>
<span>خانه</span>
</a>
<a class="footer-nav-link" href="index.html">
<span aria-hidden="true" class="footer-nav-icon footer-nav-icon--trade"></span>
<span>معامله</span>
</a>
<a class="footer-nav-link" href="possessions.html">
<span aria-hidden="true" class="footer-nav-icon footer-nav-icon--history"></span>
<span>دارایی‌ها</span>
</a>
<a aria-current="page" class="footer-nav-link footer-nav-link--active" href="finance.html">
<span aria-hidden="true" class="footer-nav-icon footer-nav-icon--accounting"></span>
<span>امور مالی</span>
</a>
</nav>
</footer>
<!-- Full-screen loading layer. JavaScript shows it for five seconds
         whenever a ruby or emerald gem button is clicked. -->
<div aria-hidden="true" class="loading-overlay">
<div class="loading-overlay-content">
<img alt="" class="loading-overlay-logo" src="assets/logo.png"/>
<p class="loading-overlay-text">گالری طلای کاریز</p>
</div>
</div>
</body>
</html>
